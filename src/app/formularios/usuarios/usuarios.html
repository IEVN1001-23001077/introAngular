<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form action="">
                    <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input
                        [(ngModel)]="ID"
                        name="ID"
                        type="text"
                        class="form-control"
                        placeholder="Ingresa tu usuario">
                    </div>

                    <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input
                        [(ngModel)]="contra"
                        name="contra"
                        type="text"
                        class="form-control"
                        placeholder="Ingresa tu  contraseña">
                    </div>
                         <br>

                    <button (click)="iniciarSesion()"
                            type="button"
                            class="btn btn-primary">
                        Iniciar sesión
                    </button>
                </form>

                <div class="col-6">
                <h2>{{mensaje}}</h2>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
