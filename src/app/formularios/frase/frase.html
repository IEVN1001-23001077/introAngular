<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de frase</title>
</head>

<body>

    <div class="container">

        <div class="row">

            <div class="col-6">

                <form>

                    <div class="form-group pt-4">

                        <label for="frase">Frase:</label>

                        <input
                            [(ngModel)]="frase"
                            name="frase"
                            type="text"
                            class="form-control"
                            placeholder="Ingresa una frase">

                    </div>

                    <br>

                    <button
                        (click)="analizarFrase()"
                        type="button"
                        class="btn btn-primary">

                        Analizar

                    </button>

                </form>

            </div>

            <div class="col-6">

                <h2>Resultado</h2>

                <p>{{resultadoVocales}}</p>

                <p>{{resultadoConsonantes}}</p>

                <p>{{resultadoPalindromo}}</p>

            </div>

        </div>

    </div>

</body>
</html>
