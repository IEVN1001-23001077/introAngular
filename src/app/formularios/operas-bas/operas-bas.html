<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-6">
            <form>
                <div class="mb-3">
                <label class="form-label">Número 1</label>
                <input
                    [(ngModel)]="num1"
                    name="num1"
                    type="number"
                    class="form-control"
                    placeholder="Ingresa el primer número">
                </div>

                <div class="mb-3">
                <label class="form-label">Número 2</label>
                <input
                    [(ngModel)]="num2"
                    name="num2"
                    type="number"
                    class="form-control"
                    placeholder="Ingresa el segundo número">
                </div>

                <div class="mb-3">
                <label class="form-label">Selecciona una operación:</label>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                        name="operacion" value="sumar"
                        [(ngModel)]="operacion">
                    <label class="form-check-label">Suma</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                        name="operacion" value="restar"
                        [(ngModel)]="operacion">
                    <label class="form-check-label">Resta</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                        name="operacion" value="multiplicar"
                        [(ngModel)]="operacion">
                    <label class="form-check-label">Multiplicación</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                        name="operacion" value="dividir"
                        [(ngModel)]="operacion">
                    <label class="form-check-label">División</label>
                </div>
                </div>

                <button type="button" class="btn btn-primary" (click)="calcular()">
                Calcular
                </button>
            </form>
            </div>

            <div class="col-6">
            <h2>Resultado: {{ resultado }}</h2>
            </div>
        </div>
    </div>
</body>
</html>
